# Amplify Hosting build spec (fullstack branch deployment).
# backend  → deploys amplify/ with `ampx pipeline-deploy` (needs the app's service role to carry
#            AmplifyBackendDeployFullAccess; the first build also bootstraps CDK in the account).
# frontend → the web build of the app (Expo Router, single-page output). `ampx pipeline-deploy` writes
#            amplify_outputs.json before this phase, so the bundle is baked with the branch's backend.
#            The hosting app needs the SPA rewrite rule documented in docs/RUNBOOK.md §3.4.
version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 22 && nvm use 22
        - node --version && npm --version
        - npm ci --cache .npm --prefer-offline --legacy-peer-deps
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - test -f amplify_outputs.json
    build:
      commands:
        - npx expo export --platform web --output-dir dist
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
